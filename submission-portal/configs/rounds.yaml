# configs/rounds.yaml — Round definitions for the IEEE CTF.
#
# Feature flags (global toggles):
# Set allow_hints: false to restrict/disable hints across all rounds.
# Set allow_skips: false to restrict/disable round skipping across all rounds.
allow_hints: true
allow_skips: true

# flag_hash is the SHA-256 hex digest of the exact flag string (case-sensitive).
# Generate it with:
#
#   ./admin rounds hash-flag --flag 'PANTHEON{your_secret_flag}'
#
# Hints live here (they are NOT stored in the DB); hint *usage* is tracked in the DB.
#   type: plain   -> costs 20% of the round's points
#   type: encoded -> costs 10% of the round's points (player must decode it)
# Hints of a type are dispensed strictly in listed order.

rounds:
  - id: 1
    name: "Round 1 — Warmup"
    points: 100
    is_active: true
    allow_hints: true
    allow_skips: false
    flag_hash: "2574da35e604fe70836157593d6171013b11042c231c5245ee9682f1a57335c2"
    hints:
      - type: plain
        text: "It’s hard to spot a ghost in a blizzard. Try looking at the negative, or throw a bucket of digital paint on the background."
      - type: encoded
        text: ""

  - id: 2
    name: "Round 2 — Crack it if you can"
    points: 150
    is_active: true
    allow_hints: true
    allow_skips: false
    flag_hash: "2fb64ebc726bc0188f1abea53539644e984fdfc1ae944cc770debaaef52485da"
    hints:
      - type: plain
        text: "Don't reinvent the wheel analyzing frequency domains. The flag was embedded using FFT Block Steganography. You can find the exact CLI extraction tool here:https://gist.github.com/aj-1729/9c6a477425dbb253a0a22f645ee329ff"
      - type: encoded
        text: "TlRJMlpETTVNekUyWXpaa05tTTJZMlkzTmprME1qWmpOak0wTnpZalltRTJOVFUzTkdVM016VmFOVGc0UkRablVUVTFOVGgwYVRZc05EazBPRFV5Tm1ZMVlUVXpOREkyTnpJMVlUVTRObUkzTlE9PQ=="

  - id: 3
    name: "Round 3 — The Hidden Baby"
    points: 300
    is_active: true
    allow_hints: false
    allow_skips: false
    flag_hash: "replace_with_sha256_hex"
    hints:
      - type: plain
        text: "Check the response headers before the page content."
      - type: encoded
        text: "5345525645523A206964656E746966792074686520686561646572"

  - id: 4
    name: "Round 4 — The Seeker's Files"
    points: 300
    is_active: false
    allow_hints: false
    allow_skips: false
    flag_hash: "9c7f970fcc02aa84c6798129ea76c12b411c81ca8cf49e3eb8c1b8c61222f3e5"
    hints:
      - type: plain
        text: "The numbers are Babylonian; the music is not what it seems."
      - type: encoded
        text: "YmFieWxvbiArIG1pZGkgPSBwbGF5IGl0IGJhY2t3YXJkcw=="
