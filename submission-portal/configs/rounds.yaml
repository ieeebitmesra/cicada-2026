  - id: 13
    name: "Round 13 — Campus Riddle 3"
    description: |-
      Not the gate, but near enough to see,
      Where sweat replaces a library's decree.
      Among five paths a student may pick,
      One's a joke, a lazy trick —
      No papers, no thought, just huff and puff,
      The easy road when books get tough.
      One voice commands here, strict yet sly,
      Cocky one moment, warm by and by.
      A younger soul lifts spirits too,
      Guides the iron, sees you through.

      Where am I?
    points: 100
    is_active: true
    allow_hints: false
    allow_skips: false
    limit_solves: true
    max_solves: 3
    flag_hash: "ff67d198dd1bedfba0257882b8724125dae5ce3fd115aa5bbb503786bea5c649"
