# configs/rounds.yaml — Round definitions for the IEEE CTF.
#
# Feature flags (global toggles):
# Set allow_hints: false to restrict/disable hints across all rounds.
# Set allow_skips: false to restrict/disable round skipping across all rounds.
allow_hints: true
allow_skips: true

# flag_hash is the SHA-256 hex digest of the exact flag string (case-sensitive).
# Generate it with:
#
#   ./admin rounds hash-flag --flag 'PANTHEON{your_secret_flag}'
#
# Hints live here (they are NOT stored in the DB); hint *usage* is tracked in the DB.
#   type: plain   -> costs 20% of the round's points
#   type: encoded -> costs 10% of the round's points (player must decode it)
# Hints of a type are dispensed strictly in listed order.

rounds:
  - id: 1
    name: "Round 1 — Warmup"
    description: "Forensics & Steganography — Examine image chunk boundaries and telegraph signaling."
    points: 100
    is_active: true
    allow_hints: true
    allow_skips: true
    flag_hash: "cd510927fc22ced613463b1132b817f9a0dc28ee5e0b101fcd01774f3258523a"
    hints:
      - type: plain
        text: "Seek past where the curtain falls—beyond the wall that marks the end (IEND). Listen to the tapping of the telegraph wire: dots and dashes in the dark. The Roman emperor's key is yours."
      - type: encoded
        text: "  Q`2Njc2NTZlMjA3Mjc1NjcyMDY3NjY2ODY1NjcyMDY3NjI2MTIwNjI1MTBhNWQyMDUxNDE1MjIwNTI1NTQ3MjA1MTQxNDI0YzUyNGYyMDU5NTY1MjQ5MjA1MjU1NDcyMGUyODA5NDIwNDc0MTU2NTUyMDVi"

