# configs/server.yaml — Submission Portal server configuration.

server:
  host: "0.0.0.0"
  port: "2222"
  host_key_path: ".ssh/id_ed25519"   # auto-generated on first start if missing

database:
  path: "ctf.db"

gameplay:
  allow_hints: true    # set to false to restrict/disable all hints
  allow_skips: true    # set to false to restrict/disable all round skips

security:
  rate_limit:
    requests_per_second: 1.0       # per-IP token bucket refill
    burst: 5                        # burst allowance
  sessions:
    max_global: 100
    max_per_ip: 3
  timeouts:
    max_session_minutes: 30
    idle_timeout_minutes: 5
  submissions:
    per_minute_per_team: 2          # flag submissions rate limit
    cooldown_seconds: 30
  input:
    max_flag_length: 256
    max_pgp_message_length: 8192
    max_team_name_length: 32

hints:
  challenge_validity_minutes: 10    # PGP-signed challenge must be this fresh
