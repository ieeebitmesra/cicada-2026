# rootfs/overlay/etc/security/limits.conf — block fork bombs + resource exhaustion.
#
# NOTE: busybox init does not read limits.conf; the orchestrator wraps sftp in
# a prlimit/seccomp-enabled launcher OR you install pam_limits + login via the
# AppArmor profile above. Values here apply when PAM is present (openssh built
# with PAM on Alpine uses /etc/pam.d/sshd → session required pam_limits.so).

seeker    hard    nproc       50
seeker    hard    nofile      256
seeker    hard    fsize       10240     # 10MB max file size
seeker    hard    cpu         300       # 5 min CPU time
seeker    hard    as          262144    # 256MB address space
seeker    hard    data        131072    # 128MB data segment
seeker    hard    memlock     64        # 64KB locked memory
