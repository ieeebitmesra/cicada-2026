#!/usr/sbin/nft -f
# /etc/nftables.conf — host firewall for the IEEE CTF platform.
#
#   2222 → Submission Portal (Wish SSH)
#   2223 → Challenge microVM (DNAT to 172.16.0.2:22)
#     22 → admin SSH (restrict YOUR_ADMIN_IP!)
#
# Load:  nft -f /etc/nftables.conf
# Test:  nft -c -f /etc/nftables.conf

flush ruleset

define ADMIN_IPS = { YOUR_ADMIN_IP }

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback
        iifname "lo" accept

        # Established/related
        ct state established,related accept
        ct state invalid log prefix "INVALID: " drop

        # Rate-limit new SSH connections (CTF ports + admin)
        tcp dport 2222 ct state new limit rate 5/minute burst 10 packets accept
        tcp dport 2223 ct state new limit rate 3/minute burst 5 packets accept
        tcp dport 22 ip saddr $ADMIN_IPS ct state new accept

        # ICMP (rate-limited)
        ip protocol icmp limit rate 5/second accept
        ip6 nexthdr icmpv6 limit rate 5/second accept

        # Log + drop everything else
        limit rate 10/second log prefix "DROPPED: " level warn
        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Established/related flows
        ct state established,related accept

        # Host → challenge VM (ssh on guest port 22 via DNAT)
        iifname != "br0" oifname "br0" tcp dport 22 accept

        # BLOCK inter-VM traffic
        iifname "br0" oifname "br0" counter drop

        # BLOCK VM egress (no reverse shells)
        iifname "br0" oifname != "lo" counter drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100;
        tcp dport 2223 dnat to 172.16.0.2:22
    }
    chain postrouting {
        type nat hook postrouting priority 100;
        # No masquerade: the challenge VM has no outbound egress by design.
    }
}
